[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gaussian-synthesis"
version = "0.1.0"
description = "Resource-bounded four-mode fermionic Gaussian continuous synthesis"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[tool.setuptools.packages.find]
where = ["src"]
